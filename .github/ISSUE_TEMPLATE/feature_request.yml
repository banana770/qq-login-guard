name: 功能建议 / 协议端适配
description: 新功能、新协议端适配、适配器
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        适配新协议端请先阅读 `docs/PROTOCOL_COMPAT.md`，并在 PR 中附上验收材料。
  - type: dropdown
    id: kind
    attributes:
      label: 类型
      options:
        - 适配其它协议端（LLOneBot / SnowLuma / Lagrange…）
        - 适配其它模拟器/真机
        - 通知通道 / 状态面板
        - 策略/熔断改进
        - 文档 / 其它
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 需求描述
      description: 你希望解决什么问题？现有方案为什么不够？
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 依据（可选）
      description: 日志/截图/issue 链接（脱敏）
    validations:
      required: false
